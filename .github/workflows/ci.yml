name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install development dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Unit tests
        run: .venv/bin/python -m pytest

  smoke:
    name: Installation and artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install without extras
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python -e .

      - name: Module entry point replays the demo
        run: .venv/bin/python -m rcv demo | diff - tests/golden/demo_transcript.txt

      - name: Console entry point replays the demo
        run: .venv/bin/rcv demo | diff - tests/golden/demo_transcript.txt

      - name: Verify Table 1
        run: .venv/bin/python smoke/print_table1.py

      - name: Verify artifact checksums
        run: |
          shasum -a 256 -c labels/SHA256SUMS
          shasum -a 256 -c results/SHA256SUMS

      - name: Validate published label maps
        run: |
          .venv/bin/python -m rcv.rebuild.label_map gate \
            --corpus native --path labels/native_pku_labels.jsonl
          .venv/bin/python -m rcv.rebuild.label_map gate \
            --corpus wgmix --path labels/wgmix_labels.jsonl
