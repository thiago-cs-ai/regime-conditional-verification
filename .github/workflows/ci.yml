name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Create venv and install (with dev extras)
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit tests (pytest)
        run: uv run pytest

      # `python -m rcv`, not the `rcv` console script: the module entry point is the one that
      # cannot be shadowed by a stale shim earlier on PATH.
      - name: Demo replays byte-for-byte
        run: uv run python -m rcv demo | diff - tests/golden/demo_transcript.txt
